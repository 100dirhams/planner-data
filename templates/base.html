<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Planner{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('overzicht') }}" class="logo">📅 Mijn planner</a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Bronnen: Flask-documentatie (flask.palletsprojects.com), Requests-documentatie (requests.readthedocs.io),
            kdg-json-server, cursusmateriaal Informatica voor IoT 2 (KdG).
            Code geschreven met hulp van Claude (Anthropic).</p>
    </footer>
</body>
</html>
